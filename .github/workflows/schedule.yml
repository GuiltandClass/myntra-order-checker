name: Myntra Hourly Order Check

on:
  schedule:
    # Runs strictly every 30 minutes, around the clock
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Cloud Browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Playwright & Browser (First Run Only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Load Cached Browser (Fast Runs)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          pip install playwright
          playwright install-deps chromium

      - name: Check Myntra & Lotus Orders
        env:
          MYNTRA_COOKIES: ${{ secrets.MYNTRA_COOKIES }}
          MYNTRA_EMAIL: ${{ secrets.MYNTRA_EMAIL }}
          MYNTRA_PASSWORD: ${{ secrets.MYNTRA_PASSWORD }}
          LOTUS_EMAIL: ${{ secrets.LOTUS_EMAIL }}
          LOTUS_PASSWORD: ${{ secrets.LOTUS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python check_orders.py
